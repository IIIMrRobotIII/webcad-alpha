<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="WebCAD Alpha — Browser-Based Parametric 3D CAD and STL Design">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.35" fill="#cbd5e1" fill-opacity="0.7" />
    </pattern>
  </defs>

  <!-- Crisp White Background with Subtle Dot Grid -->
  <rect width="1200" height="420" fill="#ffffff" />
  <rect width="1200" height="420" fill="url(#dots)" />

  <!-- Top Teal Accent Bar -->
  <rect x="0" y="0" width="1200" height="10" fill="#00788c" />

  <!-- Left Rounded Icon Card (matches original white/mint style) -->
  <g transform="translate(150, 114)">
    <rect x="0" y="0" width="192" height="192" rx="44" fill="#f0fdfa" stroke="#99f6e4" stroke-width="6" />
    <!-- Isometric CAD Cube -->
    <g transform="translate(96, 96)" stroke="#006d7e" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" stroke-width="8" />
      <polyline points="-42,-24 0,0 42,-24" stroke-width="8" />
      <line x1="0" y1="0" x2="0" y2="48" stroke-width="8" />
    </g>
  </g>

  <!-- Right Typography & Properly Sized Mint Pill -->
  <g transform="translate(388, 124)">
    <text x="0" y="54" fill="#0f172a" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-1">
      WebCAD Alpha
    </text>
    <text x="2" y="102" fill="#475569" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="400">
      Browser-Based Parametric 3D CAD &amp; STL Design
    </text>

    <!-- Single Mint Pill — generously sized so text never overflows -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="540" height="48" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2" />
      <text x="270" y="31" text-anchor="middle" fill="#006d7e" font-family="Consolas, 'SFMono-Regular', Menlo, Monaco, monospace" font-size="19" font-weight="700" letter-spacing="0.8">
        2D/3D Sketch · STL · STEP · OBJ · CAD
      </text>
    </g>
  </g>
</svg>
