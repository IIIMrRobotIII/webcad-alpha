<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="WebCAD Alpha — Browser-Based 2D and 3D Parametric CAD">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1520" />
      <stop offset="55%" stop-color="#0e2233" />
      <stop offset="100%" stop-color="#091a26" />
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00788c" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#00788c" />
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112f42" />
      <stop offset="100%" stop-color="#0a1f2e" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
    <radialGradient id="glow" cx="24%" cy="50%" r="36%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="18" fill="url(#bg)" />
  <rect width="1200" height="420" rx="18" fill="url(#grid)" />
  <rect width="1200" height="420" rx="18" fill="url(#glow)" />
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#topBar)" />
  <rect x="1" y="1" width="1198" height="418" rx="17" fill="none" stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- Left Icon Card -->
  <g transform="translate(155, 118)">
    <rect x="0" y="0" width="184" height="184" rx="36" fill="url(#iconBg)" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="3" />
    <!-- Isometric CAD Cube -->
    <g transform="translate(92, 92)" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polygon points="0,-54 47,-27 47,27 0,54 -47,27 -47,-27" stroke="#2dd4bf" stroke-width="6" fill="#00788c" fill-opacity="0.16" />
      <polyline points="-47,-27 0,0 47,-27" stroke="#2dd4bf" stroke-width="5.5" />
      <line x1="0" y1="0" x2="0" y2="54" stroke="#2dd4bf" stroke-width="5.5" />
      <circle cx="0" cy="0" r="5" fill="#e2f8f5" />
    </g>
  </g>

  <!-- Right Title & Badges -->
  <g transform="translate(388, 134)">
    <text x="0" y="42" fill="#f8fafc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="-1">
      WebCAD Alpha
    </text>
    <text x="2" y="88" fill="#94a3b8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="400">
      Browser-Based 2D &amp; 3D Parametric CAD Platform
    </text>

    <!-- Feature Pills (properly spaced, zero overflow) -->
    <g transform="translate(0, 118)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, monospace" font-size="15" font-weight="700" letter-spacing="0.8">
      <rect x="0" y="0" width="152" height="36" rx="10" fill="#0d2c3b" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.5" />
      <text x="76" y="23" text-anchor="middle" fill="#5eead4">2D / 3D CAD</text>

      <rect x="166" y="0" width="76" height="36" rx="10" fill="#0d2c3b" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5" />
      <text x="204" y="23" text-anchor="middle" fill="#7dd3fc">STL</text>

      <rect x="256" y="0" width="88" height="36" rx="10" fill="#0d2c3b" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5" />
      <text x="300" y="23" text-anchor="middle" fill="#7dd3fc">STEP</text>

      <rect x="358" y="0" width="78" height="36" rx="10" fill="#0d2c3b" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5" />
      <text x="397" y="23" text-anchor="middle" fill="#7dd3fc">OBJ</text>

      <rect x="450" y="0" width="116" height="36" rx="10" fill="#0d2c3b" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="1.5" />
      <text x="508" y="23" text-anchor="middle" fill="#5eead4">WEBGL 3D</text>
    </g>
  </g>
</svg>
